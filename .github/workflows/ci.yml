name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # extension/ is committed so it can be loaded unpacked straight from the repo. Rebuild it here and compare.
      # The RGB engine (rgb-lib.wasm, rgb-runtime.mjs) is built by engine/build.sh (Rust, ~20 min), which this job
      # doesn't run, so those two files are checked to be MASKED's engine instead of compared byte for byte.
      - name: committed RGB engine is MASKED's own
        run: node scripts/check-engine.mjs extension/rgb-lib.wasm
      - name: extension/ matches the source
        run: |
          npm run build
          git diff --stat --exit-code -- extension ':!extension/rgb-lib.wasm' ':!extension/rgb-runtime.mjs'
          test -z "$(git ls-files --others --exclude-standard -- extension)" || { git ls-files --others --exclude-standard -- extension; echo 'extension/ has files the commit lacks: run npm run build and commit extension/'; exit 1; }
