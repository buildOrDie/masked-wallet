<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MASKED Wallet</title>
<style>
:root {
  --bg: #0a0a0b;
  --card: #17171a;
  --card-2: #212126;
  --line: rgba(255,255,255,.07);
  --fg: #ffffff;
  --muted: #8b8b94;
  --btc: #f7931a;
  --btc-2: #ffb547;
  --btc-soft: rgba(247,147,26,.14);
  --sh: #9d8cff;
  --sh-2: #c3b8ff;
  --sh-soft: rgba(157,140,255,.15);
  --ok: #3fd68f;
  --err: #ff6b6b;
  --warn: #f5b94a;
  --r: 16px;
  --f: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
/* scroll with the trackpad, wheel or touch; no scrollbar drawn (like other wallet popups) */
html { scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
body { width: 360px; min-height: 600px; margin: 0 auto; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--btc); outline-offset: 2px; border-radius: 8px; }
a { color: inherit; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(10,10,11,.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.acct { display: flex; align-items: center; gap: 9px; margin-right: auto; min-width: 0; }
.logo { width: 32px; height: 32px; display: block; flex: none; }
.acct b { display: block; font-size: 14px; line-height: 1.1; }
.acct b.brand { font-weight: 900; letter-spacing: .14em; font-size: 14.5px; }
.logo img, .logo svg { width: 32px; height: 32px; display: block; object-fit: contain; }
.acct small { display: block; color: var(--muted); font-size: 11.5px; }

.net-chip { font-size: 11.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; background: var(--card-2); display: inline-flex; align-items: center; gap: 6px; }
.net-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.net-chip.test { color: var(--warn); background: rgba(245,185,74,.12); }
.net-chip.test::before { background: var(--warn); }

main { padding: 14px 16px 92px; display: grid; gap: 14px; }

/* bottom nav */
#nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 360px; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 8px 10px; background: rgba(16,16,18,.96); border-top: 1px solid var(--line); backdrop-filter: blur(14px); }
#nav button { display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 12px; }
#nav button.on { color: var(--btc); }
#nav button:hover { color: var(--fg); }
#nav button.on:hover { color: var(--btc-2); }

/* generic */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.center { text-align: center; justify-items: center; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.wrapall { word-break: break-all; margin: 0; }
.warn { color: var(--warn); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 14px; text-decoration: none; transition: filter .15s, background .15s; }
.btn svg { width: 17px; height: 17px; }
.btn.wide { width: 100%; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 12.5px; border-radius: 11px; }
.btn.primary { background: linear-gradient(135deg, var(--btc-2), var(--btc)); color: #141414; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: var(--card-2); color: var(--fg); }
.btn.ghost:hover { background: #2a2a30; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: var(--card-2); }
.icon-btn:hover { background: #2a2a30; }
.link { color: var(--sh-2); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--card-2); border: 1px solid transparent; border-radius: 12px; padding: 12px 13px; width: 100%; min-width: 0; outline: none; }
input:focus, textarea:focus, select:focus { border-color: rgba(247,147,26,.55); }
input::placeholder, textarea::placeholder { color: #66666f; }
textarea { resize: vertical; }
.msg { margin: 0; font-size: 13px; }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--err); }
.coin { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 17px; }
.coin.btc { background: var(--btc); color: #fff; }
.coin.sh { background: var(--sh-soft); color: var(--sh); }
.coin.sh svg { width: 19px; height: 19px; }
.kv .coin, .flow .coin, .recv-badge .coin, .explain .coin { width: 24px; height: 24px; font-size: 12px; }
.kv .coin svg, .flow .coin svg, .recv-badge .coin svg { width: 14px; height: 14px; }

.testnet-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--warn); background: rgba(245,185,74,.08); border: 1px solid rgba(245,185,74,.2); border-radius: 12px; padding: 8px 12px; }
.dot-warn { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }

/* home */
.hero { text-align: center; padding: 10px 0 2px; display: grid; justify-items: center; }
.hero-label { margin: 0; color: var(--muted); font-size: 13px; }
.hero-bal { margin: 4px 0 6px; font-size: 36px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-bal small { font-size: 16px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.sync { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.sync:hover { background: var(--card); color: var(--fg); }
.sync svg { width: 14px; height: 14px; }
.sync.bad { color: var(--err); }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-top: 16px; }
.act { display: grid; justify-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
.act-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--btc); transition: background .15s, transform .15s; }
.act-ic.sh { color: var(--sh); }
.act:hover .act-ic { background: #2c2c33; transform: translateY(-1px); }
.act-ic svg { width: 22px; height: 22px; }
.hint { display: grid; gap: 2px; background: var(--card); border: 1px dashed rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--muted); }
.hint b { color: var(--fg); }
.hint-cta { grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; text-align: left; border: 1px solid rgba(157,140,255,.35); background: linear-gradient(135deg, rgba(157,140,255,.16), rgba(157,140,255,.04)); }
.hint-cta > span:nth-child(2) { display: grid; }
.hint-ic { color: var(--sh); }
.hint-ic svg { width: 26px; height: 26px; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; }
.balances { display: grid; gap: 8px; }
.bal-row, .coin-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; text-align: left; width: 100%; }
button.bal-row:hover { background: #1c1c20; }
.bal-row.shielded { border-color: rgba(157,140,255,.25); }
.bal-txt { display: grid; min-width: 0; }
.bal-txt b { font-size: 15px; }
.bal-txt > span { color: var(--muted); font-size: 12px; }
.bal-amt { display: grid; justify-items: end; }
.bal-amt b { font-size: 15px; font-variant-numeric: tabular-nums; }
.bal-amt > span { color: var(--muted); font-size: 12px; }

/* view header */
.view-head { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.view-head h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.head-sp { flex: 1; }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.card .seg { background: var(--card-2); border: 0; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 36px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.seg button svg { width: 14px; height: 14px; }
.seg button[aria-checked=true] { background: #303037; color: var(--fg); }

/* receive */
.receive { justify-items: center; text-align: center; }
.recv-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.receive.shielded { border-color: rgba(157,140,255,.3); }
.qr-wrap { width: 184px; padding: 10px; background: #fff; border-radius: 16px; }
.receive.shielded .qr-wrap { box-shadow: 0 0 0 3px rgba(157,140,255,.5); }
.drop-in { width: 100%; min-height: 120px; font-size: 12px; }
.seg button svg { fill: none; stroke: currentColor; stroke-width: 2; }
.center-text { text-align: center; margin: -4px 0 10px; font-size: 13px; }
.drop-list { display: grid; gap: 4px; font-size: 12px; color: var(--muted); max-height: 180px; overflow: auto; padding-top: 8px; }
.link-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; color: var(--muted); text-align: left; }
.link-row b { color: var(--fg); }
.link-row svg { width: 18px; height: 18px; flex: none; color: var(--sh); }
.link-row > span:nth-child(2) { flex: 1; }
.relay-in { width: 100%; min-height: 96px; font-size: 12px; }
.pay-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.pay-row:last-child { border-bottom: 0; }
.pay-row small { color: var(--muted); }
.pay-row .st { text-align: right; font-weight: 700; }
.pay-row .st.waiting { color: var(--warn); } .pay-row .st.sent { color: var(--ok); } .pay-row .st.failed { color: var(--err); }
.qr { width: 100%; height: auto; display: block; stroke: none; }
.addr { margin: 0; line-height: 1.75; word-break: break-all; padding: 10px 12px; background: var(--card-2); border-radius: 12px; text-align: left; width: 100%; font-size: 12.5px; }
.addr span { margin-right: .3em; }
.addr span.alt { color: #b9b9c2; }
.info { margin: 0; color: var(--muted); font-size: 12.5px; }
.info b { color: var(--fg); }
.info.warn { color: var(--warn); }

/* forms */
.form { gap: 16px; }
.field { display: grid; gap: 7px; min-width: 0; }
.lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); display: flex; margin: 0; }
.lbl-r { margin-left: auto; font-weight: 500; }
.addr-kind { font-size: 12px; color: var(--muted); min-height: 16px; }
.addr-kind.k-shielded { color: var(--sh-2); }
.addr-kind.k-shielded::before { content: "● "; color: var(--sh); }
.addr-kind.k-public { color: var(--btc-2); }
.addr-kind.k-public::before { content: "● "; }
.addr-kind.k-wrongnet, .addr-kind.k-invalid { color: var(--err); }
.amount { display: flex; align-items: center; background: var(--card-2); border-radius: 12px; padding-right: 6px; border: 1px solid transparent; }
.amount:focus-within { border-color: rgba(247,147,26,.55); }
.amount input { border: 0 !important; background: transparent; font-size: 20px; font-weight: 700; padding: 12px 13px; }
.unit { color: var(--muted); font-size: 13px; font-weight: 600; margin-right: 8px; }
.max { font-size: 11.5px; font-weight: 800; color: var(--btc); background: var(--btc-soft); padding: 6px 9px; border-radius: 8px; }
.fees { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.fee { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 72px; padding: 6px 3px; border-radius: 12px; background: var(--card-2); border: 1px solid transparent; text-align: center; }
.fee b { font-size: 13px; }
.fee.avg b { color: var(--btc); }
.fee.fast b { color: #46d18a; }
.fee .r { font-size: 11px; color: var(--muted); white-space: nowrap; }
.fee .r em { font-style: normal; font-weight: 800; color: var(--fg); font-size: 12.5px; }
.fee .t { font-size: 10px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
.fee.on { border-color: var(--btc); background: var(--btc-soft); }
.fee-in { margin-top: 8px; padding-right: 0; }
.fee-in input { flex: 1; width: auto; font-size: 16px !important; padding: 11px 13px !important; -moz-appearance: textfield; appearance: textfield; }
.fee-in input:focus-visible { outline: none; }
.fee-in input::-webkit-outer-spin-button, .fee-in input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.fee-in .unit { margin-right: 13px; }
.fee-note { margin: 6px 2px 0; font-size: 11.5px; color: var(--muted); }
.fee-note.bad { color: #ff7b72; } .fee-note.warn { color: var(--btc); }
.rbf-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; font-weight: 700; }
.rbf-row .q { width: 17px; height: 17px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 10.5px; font-weight: 800; line-height: 15px; padding: 0; vertical-align: 1px; }
.sw-tgl { position: relative; width: 38px; height: 22px; flex: none; }
.sw-tgl input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw-tgl span { position: absolute; inset: 0; border-radius: 22px; background: var(--card-2); border: 1px solid rgba(255,255,255,.14); transition: background .15s; }
.sw-tgl span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #bbb; transition: transform .15s, background .15s; }
.sw-tgl input:checked + span { background: var(--btc); border-color: var(--btc); }
.sw-tgl input:checked + span::after { transform: translateX(16px); background: #111; }
.sw-tgl input:focus-visible + span { outline: 2px solid var(--btc); outline-offset: 2px; }
.explain { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--sh-soft); border-radius: 14px; font-size: 12.5px; color: #d9d3ff; }
.explain p { margin: 0; }
.explain .coin { background: rgba(157,140,255,.25); }
.flow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.flow-end { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--card-2); border-radius: 12px; min-width: 0; }
.flow-end span { display: grid; min-width: 0; }
.flow-end small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-arrow { color: var(--sh); font-size: 18px; font-weight: 700; }

/* review + done */
.review { text-align: center; }
.review .hero-label { margin-top: 4px; }
.kv { display: grid; gap: 0; text-align: left; background: var(--card-2); border-radius: 12px; padding: 4px 12px; }
.kvrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.kvrow:last-child { border-bottom: 0; }
.kvrow > span:first-child { color: var(--muted); flex: none; }
.kvrow > span:last-child { display: inline-flex; align-items: center; gap: 7px; text-align: right; min-width: 0; }
.kv.small .kvrow { font-size: 12px; padding: 8px 0; }
.good { color: var(--sh-2); }
.meh { color: var(--btc-2); }
.done { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 36px 8px 8px; }
.done h1 { margin: 0; font-size: 22px; }
.done p { margin: 0; color: #d0d0d6; }
.done-ic { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: rgba(63,214,143,.14); color: var(--ok); }
.done-ic svg { width: 36px; height: 36px; stroke-width: 2.4; }

/* coins list */
.list { padding: 6px; gap: 0; }
.list .coin-row { border: 0; background: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 10px; }
.list .coin-row:last-child { border-bottom: 0; }
.list > p { padding: 18px; margin: 0; }
.coin-row .coin { width: 34px; height: 34px; font-size: 15px; }
.pend { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--warn); background: rgba(245,185,74,.12); padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
.row-links { display: flex; gap: 8px; }
.row-links a { color: var(--muted); font-size: 11.5px; text-decoration: none; }
.row-links a:hover { color: var(--fg); }

/* settings */
.menu { padding: 6px; gap: 0; }
.menu-note { margin: -4px 10px 8px; }
.menu-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 10px; border-radius: 12px; text-align: left; list-style: none; cursor: pointer; }
.menu-row::-webkit-details-marker { display: none; }
button.menu-row:hover, summary.menu-row:hover { background: var(--card-2); }
.menu-row > span:first-child { display: inline-flex; align-items: center; gap: 12px; }
.menu-row > span:first-child svg { color: var(--muted); }
.menu-row select { width: auto; padding: 8px 10px; font-size: 13px; }
.menu-det[open] .chev { transform: rotate(90deg); }
.det-body { display: grid; gap: 10px; padding: 4px 10px 12px; }
.secret { display: grid; gap: 10px; padding: 4px 10px 12px; }
.words { margin: 0; padding: 12px; list-style: none; counter-reset: w; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px; background: var(--card-2); border-radius: 12px; }
.words li { counter-increment: w; font: 12.5px var(--mono); }
.words li::before { content: counter(w); color: var(--muted); display: inline-block; width: 1.7em; font-size: 10.5px; }
.adv > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
.adv > summary::after { content: "›"; font-size: 20px; line-height: 1; transition: transform .15s; }
.adv[open] > summary::after { transform: rotate(90deg); }
.adv > summary::-webkit-details-marker, .sub > summary::-webkit-details-marker { display: none; }
.review .adv { text-align: left; display: grid; gap: 10px; }
.sub { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.sub > summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; }
.sub > summary::before { content: "+ "; color: var(--muted); }
.sub[open] > summary::before { content: "− "; }
.sub .lbl { margin-top: 4px; }
.label-row { display: grid; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.inrow { display: grid; gap: 8px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }

/* tokens / BRC2.0 */
.badge { display: inline-block; vertical-align: 1px; font-size: 9.5px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--card-2); color: var(--muted); margin-left: 4px; }
.badge.v2 { background: var(--btc-soft); color: var(--btc-2); }
.card-title { margin: 0; font-weight: 800; font-size: 15px; }
input.bad { border-color: var(--err); }
.supply { margin: -2px 0 2px; }
.supply-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; margin-bottom: 6px; }
.supply-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb547, #f7931a); border-radius: 3px; }
.supply.out .supply-bar i { background: var(--err); }
.supply.out b, .supply.bad { color: var(--err); }
.info.warn { color: var(--err); border-color: rgba(255,90,90,.25); }

.warn-box { justify-content: space-between; }
.warn-box > span:nth-child(2) { flex: 1; }
.warn-box .btn { height: 30px; }
.deps { display: grid; gap: 8px; }
.dep { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.dep.ready { border-color: rgba(247,147,26,.5); }
.dep.deployed { border-color: rgba(63,214,143,.3); }
.dep-h { display: flex; align-items: center; gap: 6px; }
.dep-h svg { width: 18px; height: 18px; color: var(--ok); }
.tok { font-weight: 900; letter-spacing: .06em; font-size: 16px; }
.dep p { margin: 0; }
.steps2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
